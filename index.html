<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UtilityBelt</title>
<link rel="icon" type="image/png" href="assets/utility-belt.png">
<style>
  :root {
    --bg: #0e0e0e;
    --panel: #181818;
    --panel-hover: #202020;
    --line: #333333;
    --strap: #7d7d7d;
    --text: #ececec;
    --muted: #8c8c8c;
    --accent: #f6d03f;
    --accent2: #f39a2c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
  }
  body {
    padding: 64px 24px 80px;
  }

  /* ---- header ---- */
  header {
    max-width: 900px;
    margin: 0 auto 48px;
  }
  .eyebrow {
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 0 0 10px;
  }
  h1 {
    font-size: clamp(32px, 6vw, 48px);
    margin: 0 0 12px;
    letter-spacing: -0.01em;
    font-weight: 700;
  }
  h1 .dim { color: var(--muted); font-weight: 500; }
  h1 .logo {
    width: 1.1em;
    height: 1.1em;
    vertical-align: -0.2em;
    margin-right: 0.3em;
  }
  .tagline {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
    max-width: 540px;
    margin: 0;
  }

  /* ---- the belt: a horizontal strap with loop ticks ---- */
  .belt {
    max-width: 900px;
    margin: 40px auto 4px;
    position: relative;
    height: 28px;
  }
  .belt svg { width: 100%; height: 100%; display: block; }

  /* ---- pouches (applet cards), hanging off the belt ---- */
  .pouches {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
  }
  .pouch {
    background: var(--panel);
    border: 1px solid var(--line);
    border-top: none;
    border-radius: 0 0 10px 10px;
    padding: 18px 16px 16px;
    text-decoration: none;
    color: var(--text);
    display: block;
    position: relative;
    opacity: 0;
    transform: translateY(-6px);
    animation: drop 0.45s ease forwards;
    transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
  }
  .pouch:hover, .pouch:focus-visible {
    background: var(--panel-hover);
    border-color: var(--accent);
    transform: translateY(2px);
    outline: none;
  }
  .pouch:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  .pouch::before {
    /* stitching strap connecting to the belt above */
    content: "";
    position: absolute;
    top: -14px;
    left: 20px;
    width: 2px;
    height: 14px;
    background: var(--strap);
  }
  .pouch .loop {
    font-size: 11px;
    color: var(--accent2);
    letter-spacing: 0.05em;
    margin: 0 0 8px;
  }
  .pouch h2 {
    font-size: 16px;
    margin: 0 0 8px;
    font-weight: 600;
  }
  .pouch p {
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--muted);
    margin: 0;
  }
  .pouch .go {
    display: inline-block;
    margin-top: 12px;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.03em;
  }

  /* empty slot, invites adding the next tool */
  .pouch.empty {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    border-style: dashed;
    font-size: 12px;
    min-height: 96px;
  }

  @keyframes drop {
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .pouch { animation: none; opacity: 1; transform: none; }
  }

  footer {
    max-width: 900px;
    margin: 56px auto 0;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.7;
  }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--accent); }
</style>
</head>
<body>

<header>
  <p class="eyebrow">/ home</p>
  <h1><img class="logo" src="assets/utility-belt.png" alt="">Utility<span class="dim">Belt</span></h1>
  <p class="tagline">A running collection of small, self-contained web tools. No installs, no accounts — pick one off the belt and use it.</p>
</header>

<div class="belt">
  <svg viewBox="0 0 900 28" preserveAspectRatio="none">
    <line x1="0" y1="10" x2="900" y2="10" stroke="#7d7d7d" stroke-width="2"></line>
    <line x1="0" y1="10" x2="900" y2="10" stroke="#f6d03f" stroke-width="2" stroke-dasharray="1 39" stroke-linecap="round" opacity="0.9"></line>
  </svg>
</div>

<main class="pouches" id="pouches"></main>

<footer>
  UtilityBelt &mdash; each tool below is a single self-contained page. No backend, no build step.<br>
  <a href="https://www.flaticon.com/free-icons/utility-belt" title="utility belt icons">Utility belt icon from Flaticon</a>
</footer>

<script>
  // Add a future applet here: { name, file, description }
  // file is relative to /applets/
  const applets = [
    {
      name: "WhatsApp Chat Viewer",
      file: "whatsapp-viewer.html",
      description: "Reconstruct an exported WhatsApp chat back into a familiar message view."
    },
    {
      name: "Test Platform",
      file: "exam-platform.html",
      description: "Run a self-made JSON quiz or practice exam with instant scoring."
    },
    {
      name: "Multigraph Builder",
      file: "multigraph-builder.html",
      description: "Build and drag around a graph, including parallel edges, from a dependency list or by hand."
    },
    {
      name: "Random URL Opener",
      file: "random-url-opener.html",
      description: "Fill a random number, string, or list pick into a URL template and open the results in new tabs."
    },
    {
      name: "Merge Tree Builder",
      file: "merge-tree.html",
      description: "Chart who met whom and what merged into what, as a timeline or bracket diagram."
    }
  ];

  const container = document.getElementById('pouches');

  applets.forEach((tool, i) => {
    const a = document.createElement('a');
    a.className = 'pouch';
    a.href = 'applets/' + tool.file;
    a.style.animationDelay = (i * 60) + 'ms';
    a.innerHTML =
      '<p class="loop">LOOP ' + String(i + 1).padStart(2, '0') + '</p>' +
      '<h2>' + tool.name + '</h2>' +
      '<p>' + tool.description + '</p>' +
      '<span class="go">Open &rarr;</span>';
    container.appendChild(a);
  });

  const empty = document.createElement('div');
  empty.className = 'pouch empty';
  empty.textContent = '+ next tool goes here';
  container.appendChild(empty);
</script>

</body>
</html>
